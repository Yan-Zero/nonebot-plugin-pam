[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nonebot-plugin-pam"
version = "0.2.3"
description = "Nonebot 2 的权限与访问管理。"
authors = [{ name = "Yan", email = "1964649083@qq.com" }]
requires-python = ">=3.11, <4"
readme = "README.md"
license = "Apache-2.0"
dependencies = ["fastapi>=0.117.1", "nonebot2>=2.4.0,<3", "pyyaml>=6.0.3"]

[project.optional-dependencies]
redis = ["redis>=6.4.0"]
apscheduler = ["nonebot-plugin-apscheduler>=0.5.0"]
